title: IBM i Open Source Setup
description: A practical guide to setting up and running open source software on IBM i — yum, RPMs, SSH, the editor workflow, and the conventions that make it work.
remote_theme: just-the-docs/just-the-docs
url: https://ospm.k3s.com

# just-the-docs configuration
color_scheme: light
search_enabled: true
heading_anchors: true

# Google Analytics
ga_tracking: G-9QNQPY8BD6
ga_tracking_anonymize_ip: true

# Top-right auxiliary links
aux_links:
  "View on GitHub":
    - "https://github.com/K3S/SetupOSPMforIBMi"
  "Sponsored by K3S":
    - "https://k3s.com"
aux_links_new_tab: true

# External link in the sidebar
nav_external_links:
  - title: King III Solutions
    url: https://k3s.com
    hide_icon: false
  - title: RPG Tutorial
    url: https://rpgtutorial.k3s.com/
    hide_icon: false
  - title: PHP, PDO & ODBC on IBM i
    url: https://odbcphp.k3s.com/
    hide_icon: false
  - title: Action API Pattern
    url: https://action-api-pattern.k3s.com/
    hide_icon: false
  - title: AI Patterns For Business Systems
    url: https://aipatterns.k3s.com
    hide_icon: false
  - title: IBM i AI Workers
    url: https://ibmi-ai-workers.k3s.com
    hide_icon: false

# Footer
footer_content: 'Maintained by <a href="https://k3s.com">King III Solutions, Inc.</a> &middot; Prose: <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>. Code samples: <a href="https://opensource.org/licenses/MIT">MIT</a>.'

# Edit-this-page link
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/K3S/SetupOSPMforIBMi"
gh_edit_branch: "master"
gh_edit_view_mode: "tree"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Don't try to render the LICENSE files
exclude:
  - LICENSE
  - LICENSE-PROSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
